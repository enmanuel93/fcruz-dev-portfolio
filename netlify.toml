[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Every route (/about, /projects, ...) is the same single page; React Router
# picks the section. Real files in dist/ are still served as they are.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
